volumes:
  db_data:
    driver: local

services:
  database:
    image: dhi.io/postgres:18.1-alpine3.22-dev
    container_name: "bolao-database"
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=bolao
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U docker -d bolao'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - "db_data:/var/lib/postgresql/data"
